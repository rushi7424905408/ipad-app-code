<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)"/>
  <rect x="34" y="34" width="444" height="444" rx="98" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Book Base -->
  <path d="M 120 140 Q 256 160 392 140 L 392 370 Q 256 390 120 370 Z" fill="#ffffff" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
  
  <!-- German Flag Accent Spine -->
  <path d="M 248 155 L 264 155 L 264 380 L 248 380 Z" fill="#0f172a"/>
  <path d="M 248 230 L 264 230 L 264 305 L 248 305 Z" fill="url(#redGrad)"/>
  <path d="M 248 305 L 264 305 L 264 380 L 248 380 Z" fill="url(#goldGrad)"/>

  <!-- Golden Highlighter Stroke -->
  <rect x="150" y="210" width="80" height="24" rx="4" fill="url(#goldGrad)" opacity="0.85"/>
  <rect x="150" y="260" width="65" height="18" rx="3" fill="url(#goldGrad)" opacity="0.5"/>
  <rect x="280" y="210" width="75" height="18" rx="3" fill="url(#goldGrad)" opacity="0.5"/>

  <!-- DE Badge -->
  <circle cx="360" cy="340" r="32" fill="url(#goldGrad)"/>
  <text x="360" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="22" font-weight="900" fill="#713f12" text-anchor="middle">DE</text>
</svg>